<!DOCTYPE html>
<html>
<head>
    <title>Exercise 48 - Compute the Double</title>
</head>
<body>
    <h2>Input a number</h2>

    <form action="/predict" method="post">
        <input type="number" name="x" placeholder="Enter an integer..." required>
        <button type="submit">Submit</button>
    </form>

    {% if result is not none %}
        <hr>
        <h3>Double Result: {{ result }}</h3>
    {% endif %}
</body>
</html>
